<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - EC Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1><a href="index.html">EC Shop</a></h1>
    <nav>
      <a href="index.html">Back to Products</a>
    </nav>
  </header>

  <main class="container">
    <h2>Shopping Cart</h2>

    <div id="cart-container">
      <table id="cart-table">
        <thead>
          <tr>
            <th>Product Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Subtotal</th>
          </tr>
        </thead>
        <tbody id="cart-items">
          <!-- Rows dynamically rendered via JS -->
        </tbody>
      </table>

      <div class="cart-summary">
        <p>Total: <span id="total-price">$0</span></p>
      </div>

      <!-- Order confirmation button excluded until Lesson 19 -->
    </div>
  </main>

  <script src="cart.js"></script>
</body>
</html>
